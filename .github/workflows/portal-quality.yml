name: Portal quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./prisma/ci.db
      BOOKING_TOKEN_SECRET: ci-only-booking-token-secret-not-for-production
      PARTNER_ADMIN_KEY: ci-only-partner-admin-key-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate database client
        run: npm run db:generate

      - name: Apply CI database migrations
        run: npm run db:deploy

      - name: Verify portal
        run: npm run check

      - name: Start production portal
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > portal-runtime.log 2>&1 &
          echo $! > portal-runtime.pid

      - name: Wait for production portal
        run: node scripts/wait-for-runtime.mjs

      - name: Verify live routes, accessibility, and bounded load
        run: npm run test:runtime

      - name: Install isolated administrator browser-test tools
        run: |
          npm install --prefix .gh-task-cache/browser-tools --no-package-lock --no-save playwright@1.58.2
          PLAYWRIGHT_BROWSERS_PATH=.gh-task-cache/browsers node .gh-task-cache/browser-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Prepare isolated administrator fixtures and server
        run: |
          node --experimental-strip-types scripts/seed-admin-audit.mts
          DATABASE_URL="file:${GITHUB_WORKSPACE}/prisma/admin-audit-e2e.db" PUBLIC_APP_ORIGIN=https://localhost:3019 npm run start -- --hostname 127.0.0.1 --port 3019 > admin-audit-runtime.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{if((await fetch('http://localhost:3019/login')).ok)process.exit(0);}catch{} await new Promise(r=>setTimeout(r,1000));}process.exit(1);"

      - name: Verify every administrator route and core decision workflows
        env:
          PLAYWRIGHT_BROWSERS_PATH: .gh-task-cache/browsers
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.gh-task-cache/browser-tools/node_modules/playwright/index.mjs
        run: node scripts/test-admin-browser.mjs

      - name: Verify OTA hotel supplier routes and PMS exclusion
        env:
          PLAYWRIGHT_BROWSERS_PATH: .gh-task-cache/browsers
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.gh-task-cache/browser-tools/node_modules/playwright/index.mjs
        run: node scripts/test-partner-ota-browser.mjs

      - name: Verify every customer account route
        env:
          PLAYWRIGHT_BROWSERS_PATH: .gh-task-cache/browsers
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.gh-task-cache/browser-tools/node_modules/playwright/index.mjs
        run: node scripts/test-customer-browser.mjs

      - name: Retain administrator audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: administrator-browser-audit
          retention-days: 7
          path: |
            .gh-task-cache/admin-browser-results.json
            .gh-task-cache/admin-request-desktop.png
            .gh-task-cache/admin-request-mobile.png
            .gh-task-cache/partner-ota-browser-audit.json
            .gh-task-cache/customer-browser-audit.json
            admin-audit-runtime.log

      - name: Show runtime log after failure
        if: failure()
        run: cat portal-runtime.log || true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build standalone web image
        run: docker build --target runner --tag mandyal-travels:${{ github.sha }} .

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mandyal_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mandyal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandyal_ci?schema=public&sslmode=disable
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandyal_ci?schema=public&sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply native PostgreSQL migrations
        run: npm run db:deploy:postgresql

      - name: Verify live PostgreSQL schema
        run: npm run db:verify:postgresql:live

      - name: Rehearse isolated PostgreSQL backup and restore
        env:
          OTA_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/rehearse-ci-postgresql-recovery.mjs

      - name: Verify restored PostgreSQL schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandyal_restore_ci?schema=public&sslmode=disable
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandyal_restore_ci?schema=public&sslmode=disable
        run: npm run db:verify:postgresql:live

      - name: Retain PostgreSQL recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-recovery-evidence
          retention-days: 7
          path: .gh-task-cache/postgresql-recovery.json
          if-no-files-found: error
